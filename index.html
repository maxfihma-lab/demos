<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fihma Advisory Demos</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7f9;
      color: #1a1a1a;
      line-height: 1.5;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    p { margin: 0 0 12px; color: #444; }
    .muted { color: #6b7280; font-size: .95rem; }
    a { color: #0f766e; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>Fihma Advisory</h1>
      <p>Personalized AI booking demos for local businesses.</p>
      <p class="muted">These pages are private previews shared with individual owners. Nothing here books appointments or sends messages for real.</p>
      <p class="muted">Questions: <a href="mailto:max@fihmaadvisory.com">max@fihmaadvisory.com</a></p>
    </div>
  </main>
</body>
</html>
